<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Python Fundamentals - DuoProg</title>
</head>

<body>

    <h1>Python Fundamentals</h1>

    <main class="course-map">
        <!-- Node 1: Introduction (Left) -->
        <div class="lesson left available" id="lesson-introduction">
            <button class="lesson-button" onclick="openLesson('introduction')" aria-label="Introducción">
                <span class="node-icon">
                    <img src="assets/images/python-logo.png" alt="Python Logo" class="python-logo-icon">
                </span>
            </button>
            <h2>Introducción</h2>
            <p>Aprende qué es programar</p>
        </div>

        <!-- Path 1: Connects Introduction to Variables -->
        <div class="path path-right" id="path-1"></div>

        <!-- Node 2: Variables (Right) -->
        <div class="lesson right locked" id="lesson-variables">
            <button class="lesson-button" onclick="openLesson('variables')" aria-label="Variables">
                <span class="node-icon">📦</span>
            </button>
            <h2>Variables</h2>
            <p>Aprende a guardar información</p>
        </div>

        <!-- Path 2: Connects Variables to Data Types -->
        <div class="path path-left" id="path-2"></div>

        <!-- Node 3: Data Types (Left) -->
        <div class="lesson left locked" id="lesson-dataTypes">
            <button class="lesson-button" onclick="openLesson('dataTypes')" aria-label="Tipos de Datos">
                <span class="node-icon">🔤</span>
            </button>
            <h2>Tipos de Datos</h2>
            <p>Conoce los tipos de datos básicos</p>
        </div>
    </main>

    <script type="module" src="script.js"></script>

    <nav class="bottom-nav">
        <button onclick="window.location.href='duoprog.html'">
            <span>📝</span>
            <span>CRUD</span>
        </button>

        <button onclick="window.location.href='index.html'">
            <span>📚</span>
            <span>Lessons</span>
        </button>
        
        <button onclick="window.location.href='duoprog.html#leaderboard'">
            <span>🏆</span>
            <span>Ranking</span>
        </button>
        
        <button onclick="window.location.href='courses.html'">
            <span>🔍</span>
            <span>Buscar</span>
        </button>
    </nav>
</body>

</html>
