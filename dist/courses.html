<!DOCTYPE html>
<html lang="es">

<head>

    <div id="navbar"></div>

    <main class="courses-page">

        <header class="courses-header">

            <button class="course-card">

                <div class="course-icon">
                    🌐
                </div>

                <div class="course-info">

                    <p>
                        Aprende HTML, CSS y JavaScript moderno.
                    </p>

                    <span>Principiante</span>

                </div>

            </button>


            <button class="course-card">

                <div class="course-icon">
                    🗄️
                </div>

                <div class="course-info">
