<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Lección - DuoProg</title>

</head>

<body>

    <main class="lesson-page">

        <header class="lesson-header">

            <button class="back-button" onclick="history.back()">
                ←
            </button>

            <div class="lives">

    <img id="life-1" src="assets/ui/heart-full.png" alt="Life">

    <img id="life-2" src="assets/ui/heart-full.png" alt="Life">

    <img id="life-3" src="assets/ui/heart-full.png" alt="Life">

</div>
        </header>


        <!-- INFO SCREEN -->

        <section id="info-screen" class="info-screen">

            <h1 id="info-title"></h1>

            <p id="info-text"></p>

            <button id="info-next" class="next-button">
                CONTINUAR
            </button>

        </section>


        <!-- QUESTION SCREEN -->

        <section class="question">

            <p class="question-number" id="question-number"></p>

            <h1 id="question-text"></h1>
            <pre id="question-code"></pre>
            
            <textarea id="code-editor" placeholder="Escribe tu código aquí..."></textarea>

            <div class="answers">

                <button class="answer" id="answer-1"></button>

                <button class="answer" id="answer-2"></button>

                <button class="answer" id="answer-3"></button>

                <button class="answer" id="answer-4"></button>

            </div>

            
        </section>


        <button class="check-button" onclick="checkAnswer()">
            COMPROBAR
        </button>

    <!-- GAME OVER SCREEN -->

<section id="game-over-screen" class="game-over-screen">

    <div class="game-over-content">

        <h1>¡Te quedaste sin vidas!</h1>

        <p>Has agotado tus vidas en esta lección.</p>

        <button id="retry-button" class="retry-button">
            REINTENTAR
        </button>

        <button id="exit-button" class="exit-button">
            SALIR DE LA LECCIÓN
        </button>

    </div>

</section>


<!-- COMPLETION SCREEN -->

<section id="completion-screen" class="completion-screen" style="display: none;">

    <div class="completion-content">
        <h1>¡Lección Completada!</h1>

        <p class="xp-reward">+25 XP</p>

        <button onclick="goBackToCourse()">
            CONTINUAR
        </button>
    </div>

</section>




    </main>

    <script type="module" src="script.js"></script>

</body>

</html>
